name: Cekic Tarayici
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      liste:
        description: "Tüm Hyperliquid marketlerini Telegram a gönder"
        type: boolean
        default: false
      test:
        description: "Geçmiş testini çalıştır (10-15 dk sürer)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ${{ inputs.test && 'cekic-test' || 'cekic' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python cekic_bot.py
        env:
          RUN_ONCE: "1"
          LIST_MARKETS: ${{ inputs.liste && '1' || '' }}
          BACKTEST: ${{ inputs.test && '1' || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Durumu kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
